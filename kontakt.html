<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Kontakt</title>
</head>

<body>
  <header>
    <nav>
      <ul class="header-list">
        <li><a href="index.html">Startsida</a></li>
        <li><a href="hobby.html">Hobby</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1 class="title">Kontakt Sida</h1>
    <section class="kontakt-section">
      <form method="post">
        <h2>Registrera dig</h2>
        <label for="name">Namn</label>
        <input type="text" id="name" name="name" placeholder="John Doe">
        <br>
        <label for="age">Åldere</label>
        <input type="number" id="age" name="age" min="0" max="100" placeholder="ålder">
        <br>
        <label for="email">E-post</label>
        <input type="text" id="email" name="email" required placeholder="example@email.com">
        <br>
        <label for="password">Lösenord</label>
        <input type="password" id="password" name="password" placeholder="Lösenord" required>
        <br>
        <label for="textarea">Meddelande</label>
        <textarea id="textarea" name="textarea" cols="5"></textarea>
        <fieldset>
          <legend>Kön</legend>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Man</label>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Kvinna</label>
          <input type="radio" id="annat" name="gender" value="annat">
          <label for="annat">Vill ej uppger</label>
        </fieldset>
        <div class="checkox-conatiner">
          <input type="checkbox" name="checkbox" id="checkbox">
          <label class="checkbox" for="checkbox">Godkänn villkoren
            och
            policyerna.</label>
        </div>
        <button type="submit">Registrera</button>
        <div class="kontakt-login">
          <p>Har du redan ett konto?</p>
        </div>
        <button type="submit">Logga in</button>
      </form>
    </section>
    <p class="kontakt-para">"Du kan också nå mig direkt på<a href="mailto:student_id@student.miun.se">
        [student_id@student.miun.se]"</a></p>
  </main>
  <footer>&#169; 2026 Paul Yashouh</footer>
</body>

</html>
